<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartFinds - Find Useful Products</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .search-area {
      padding: 20px 15px;
      text-align: center;
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 10px 15px 40px;
    }

    .section-title {
      margin-top: 15px;
      text-align: center;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .product {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .product h3 {
      font-size: 18px;
      margin: 10px 0;
    }

    .product p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .amazon-button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      background: #ff9900;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .amazon-button:hover {
      opacity: 0.9;
    }

    .disclosure {
      margin-top: 35px;
      padding: 15px;
      background: #fff;
      border-radius: 10px;
      font-size: 13px;
      color: #555;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111827;
      color: #ccc;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>SmartFinds</h1>
    <p>Discover useful products and find them online</p>
  </header>

  <div class="search-area">
    <input
      type="text"
      id="searchBox"
      class="search-box"
      placeholder="Search products..."
      onkeyup="searchProducts()"
    >
  </div>

  <main class="container">

    <h2 class="section-title">Featured Finds</h2>

    <div class="products">

      <div class="product" data-name="women watches stylish watch">
        <h3>100 Most Popular Women's Watches</h3>

        <p>
          Explore this collection of popular women's watches on Amazon.
        </p>

        <a
          class="amazon-button"
          href="https://www.amazon.in/100-MOST-POPULAR-WOMENS-WATCHES/dp/B0H8SBWLR7?crid=3JNHT9EVKGB6N&dib=eyJ2IjoiMSJ9.l6ngH1MCFlcSRD7g7ylcPQKtIeDwLJ4e01ohu1BJNrPxeE_on1ZnEsKqp2aZq2lnnVACNJObVxYvexoz9E90JolZSvafDua1vIA3kB5rRZ1IHmTYGlCVl26kg-GD4to-Ea-rbJC1-t5rkpClQ5ForpoOJ5vibkuQVcCqyizUawRORKBLXYa9ojgkTfqIOMaAS_jRarDHDZaw2Ok_g68YSAuzc8-6zN1C_IsR3mOes-k.dcOdzFacDnqn8kkyttH4Wdr_1NR42BBL7K5Nva7INHY&dib_tag=se&keywords=watch+for+women+stylish&qid=1788080466&s=books&sprefix=watch%2Cstripbooks%2C2601&sr=1-1&linkCode=ll2&tag=smartfind08b7-21&linkId=1fb518070ad22e2001edd4f0632b325a&ref_=as_li_ss_tl"
          target="_blank"
          rel="nofollow sponsored noopener"
        >
          View on Amazon
        </a>
      </div>

    </div>

    <div class="disclosure">
      As an Amazon Associate, we earn from qualifying purchases.
    </div>

  </main>

  <footer>
    © 2026 SmartFinds
  </footer>

  <script>
    function searchProducts() {
      const search = document
        .getElementById("searchBox")
        .value
        .toLowerCase();

      const products = document.querySelectorAll(".product");

      products.forEach(function(product) {
        const name = product
          .getAttribute("data-name")
          .toLowerCase();

        if (name.includes(search)) {
          product.classList.remove("hidden");
        } else {
          product.classList.add("hidden");
        }
      });
    }
  </script>

</body>
</html>
