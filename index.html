<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFinds</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:35px 15px;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  color:#d1d5db;
}

.search{
  background:white;
  padding:25px 15px;
  text-align:center;
}

#searchBox{
  width:92%;
  max-width:650px;
  padding:15px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.filters{
  background:white;
  text-align:center;
  padding:10px 15px 25px;
}

.filters button{
  margin:4px;
  padding:9px 13px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#f8fafc;
  cursor:pointer;
}

.filters button.active{
  background:#111827;
  color:white;
}

h2{
  max-width:1100px;
  margin:25px auto 5px;
  padding:0 20px;
}

.products{
  max-width:1100px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.product{
  background:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 3px 12px #ddd;
}

.product-image{
  height:180px;
  border-radius:10px;
  background:#eef1f5;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-weight:bold;
  color:#6b7280;
}

.product h3{
  margin-bottom:6px;
}

.category{
  display:inline-block;
  margin-top:12px;
  padding:5px 8px;
  background:#eef2ff;
  border-radius:6px;
  font-size:12px;
}

.retailer{
  font-size:13px;
  color:#666;
  margin-top:6px;
}

.product p{
  color:#596273;
  line-height:1.5;
}

.price{
  font-weight:bold;
  margin:12px 0;
}

.product button{
  width:100%;
  padding:11px;
  margin-top:6px;
  border-radius:8px;
  cursor:pointer;
}

.details{
  background:white;
  border:1px solid #ddd;
}

.info{
  display:none;
  background:#f3f4f6;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  font-size:14px;
}

.compare{
  background:white;
  border:1px solid #111827;
}

.compare.selected{
  background:#111827;
  color:white;
}

.no-results{
  display:none;
  text-align:center;
  padding:60px 20px;
}

footer{
  margin-top:30px;
  background:#111827;
  color:#ddd;
  text-align:center;
  padding:30px;
}

@media(max-width:600px){
  .products{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛍️ SmartFinds</h1>

</header>

<div class="search">

  <button class="category" onclick="chooseCategory('Gifts',this)">
    🎁 Gifts
  </button>

  <br><br>

  <strong>Retailers</strong><br>

  <button class="retailer active" onclick="chooseRetailer('All',this)">
    All
  </button>

  <button class="retailer" onclick="chooseRetailer('Amazon',this)">
    Amazon
  </button>

  <button class="retailer" onclick="chooseRetailer('Flipkart',this)">
    Flipkart
  </button>

  <button class="retailer" onclick="chooseRetailer('AJIO',this)">
    AJIO
  </button>

  <button class="retailer" onclick="chooseRetailer('Urbanic',this)">
    Urbanic
  </button>

</div>

<h2>Products</h2>

<div class="products" id="products"></div>

<div class="no-results" id="noResults">
  <h2>No matching products</h2>
  <p>Try another search.</p>
</div>

<footer>
  <p>SmartFinds © 2026</p>
  <p>Product information should always be checked with the retailer.</p>
</footer>

/* =========================
   FILTERS
========================= */

let selectedCategory="All";
let selectedRetailer="All";


function renderProducts(){

const search =
document
.getElementById("searchBox")
.value
.toLowerCase()
.trim();


const results = products.filter(product=>{

const categoryMatch =
selectedCategory==="All" ||
product.category===selectedCategory;

const retailerMatch =
selectedRetailer==="All" ||
product.retailer===selectedRetailer;

const searchText =
(
product.name+" "+
product.category+" "+
product.retailer+" "+
product.description
).toLowerCase();

const searchMatch =
search==="" ||
searchText.includes(search);

return categoryMatch &&
retailerMatch &&
searchMatch;

});


const container =
document.getElementById("products");

const noResults =
document.getElementById("noResults");

container.innerHTML="";


if(results.length===0){

noResults.style.display="block";

return;

}


noResults.style.display="none";


results.forEach(product=>{

const card =
document.createElement("div");

card.className="product";


card.innerHTML=`

<div class="product-image">
🖼️<br>
Image coming soon
</div>

<div class="category">
${product.category}
</div>

<h3>
${product.name}
</h3>

<div class="retailer">
Retailer: ${product.retailer}
</div>

<p>
${product.description}
</p>

<div class="price">
Price: Check retailer
</div>

<button
class="details"
onclick="showDetails(this)">
More Details
</button>

<div class="info">
<strong>Product:</strong>
${product.name}<br><br>

<strong>Category:</strong>
${product.category}<br><br>

<strong>Retailer:</strong>
${product.retailer}<br><br>

We have not added a product photograph
until a correctly matching image can
be sourced.
</div>

`;


container.appendChild(card);

});

}


function showDetails(button){

const info =
button.nextElementSibling;

if(info.style.display==="block"){

info.style.display="none";
button.innerText="More Details";

}else{

info.style.display="block";
button.innerText="Hide Details";

}

}


function chooseCategory(category,button){

selectedCategory=category;

document
.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

renderProducts();

}


function chooseRetailer(retailer,button){

selectedRetailer=retailer;

document
.querySelectorAll(".retailer")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

renderProducts();

}


document
.getElementById("searchBox")
.addEventListener("input",renderProducts);


renderProducts();
